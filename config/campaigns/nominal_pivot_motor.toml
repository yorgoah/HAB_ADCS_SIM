# Wheel and pivot motor, 50 runs of 600 s, each at a fixed altitude between 1 and 25 km
name = "nominal_pivot_motor"
base_parameters = "config/sim_params/parameters_ec60.json"
samples_per_case = 50
include_nominal = false
noise_seed = 3545
# Different wind in each run, same sensor noise
vary_wind = true
sampling = { method = "random", seed = 1 }

[overrides]
"simulation.duration" = 600.0
"pointing.state_machine" = false
"lt_motor.activate" = true
"wind_params.model" = "surrogate"
"wind_params.ascent_rate_m_s" = 0.0

[dispersions."Payload_params.Ip"]
dist = "normal"
sigma_rel = 0.10
min = 0.01
link = ["lt_motor.load_inertia"]

[dispersions."Payload_params.Cp"]
dist = "normal"
sigma_rel = 0.5
min = 0.0

[dispersions."rw_motor.load_inertia"]
dist = "normal"
sigma_rel = 0.1
min = 0.0

[dispersions."rw_motor.viscous_friction_coeff"]
dist = "uniform"
rel = 0.5
min = 0.0

[dispersions."lt_motor.viscous_friction_coeff"]
dist = "uniform"
low = 0.0016
high = 0.0048

[dispersions."lt_motor.coulomb_friction"]
dist="normal"
sigma_rel = 0.2
min = 0.0

[dispersions."wind_params.start_altitude_m"]
dist = "uniform"
low = 1000.0
high = 25000.0